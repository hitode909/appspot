<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>発表タイマー</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #fffdf5; color: #222; user-select: none; }
    main { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; padding: 16px; }
    .time { font-size: min(30vw, 50vh); font-weight: bold; font-variant-numeric: tabular-nums; line-height: 1; }
    .msg { font-size: clamp(18px, 4vw, 40px); min-height: 1.5em; color: #555; }
    .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
    button { font: inherit; font-size: 18px; padding: 6px 16px; border: 1px solid #222; border-radius: 999px; background: #fff; cursor: pointer; }
    button.on { background: #222; color: #fff; }
    .hint { font-size: 13px; color: #777; }
    body.soon { background: #fff3c4; }
    body.over { background: #222; color: #fffdf5; }
    body.over .msg, body.over .hint { color: #ddd; }
    body.running .row, body.running .hint { opacity: 0.15; }
    body.running .row:hover { opacity: 1; }
  </style>
</head>
<body>
  <main>
    <div class="msg" id="msg">持ち時間を選んでください</div>
    <div class="time" id="time">3:00</div>
    <div class="row" id="presets"></div>
    <div class="row">
      <button id="start">はじめる</button>
      <button id="reset">もどす</button>
    </div>
    <p class="hint">スペースで開始・一時停止、R でもどす。時間を過ぎても止めずに数え続けます</p>
  </main>
  <script>
    const PRESETS = [1, 3, 5, 10];
    let limit = 180, startedAt = null, elapsed = 0, timer = null;
    const $ = (id) => document.getElementById(id);
    const fmt = (s) => `${s < 0 ? '+' : ''}${Math.floor(Math.abs(s) / 60)}:${String(Math.abs(s) % 60).padStart(2, '0')}`;
    const now = () => elapsed + (startedAt ? (Date.now() - startedAt) / 1000 : 0);
    const draw = () => {
      const rest = Math.ceil(limit - now());
      $('time').textContent = fmt(rest);
      document.body.classList.toggle('soon', rest <= 30 && rest > 0);
      document.body.classList.toggle('over', rest <= 0);
      document.body.classList.toggle('running', !!startedAt);
      $('msg').textContent = rest <= 0 ? '時間です。最後のひとことをどうぞ' : rest <= 30 ? 'あと30秒' : startedAt ? '' : (elapsed ? '一時停止中' : '持ち時間を選んでください');
      $('start').textContent = startedAt ? '止める' : (elapsed ? 'つづける' : 'はじめる');
      $('presets').innerHTML = PRESETS.map((m) => `<button data-min="${m}" class="${limit === m * 60 ? 'on' : ''}">${m}分</button>`).join('');
    };
    const toggle = () => {
      if (startedAt) { elapsed = now(); startedAt = null; clearInterval(timer); }
      else { startedAt = Date.now(); timer = setInterval(draw, 200); }
      draw();
    };
    const reset = () => { startedAt = null; elapsed = 0; clearInterval(timer); draw(); };
    $('start').addEventListener('click', toggle);
    $('reset').addEventListener('click', reset);
    $('presets').addEventListener('click', (e) => {
      const b = e.target.closest('[data-min]');
      if (b) { limit = Number(b.dataset.min) * 60; reset(); }
    });
    addEventListener('keydown', (e) => {
      if (e.key === ' ') { e.preventDefault(); toggle(); }
      if (e.key === 'r' || e.key === 'R') reset();
    });
    draw();
  </script>
</body>
</html>
