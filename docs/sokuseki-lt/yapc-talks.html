<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YAPCトーク研究室</title>
  <style>
    * { box-sizing: border-box; }
    /* 1画面に1枚。はみ出す分は次の1枚に送り、←→ でめくる。縦にスクロールさせない */
    html, body { height: 100%; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #fff; color: #222; line-height: 1.5; overflow: hidden;
      --u: min(1vw, 1.78vh); font-size: max(13px, calc(1.9 * var(--u))); }
    a { color: #0a58ca; }
    main { height: 100%; display: flex; flex-direction: column; padding: calc(2 * var(--u)) calc(4 * var(--u)) calc(1.2 * var(--u)); }
    h1 { margin: 0; font-size: 1em; color: #777; font-weight: normal; }
    h2 { margin: 0 0 0.3em; font-size: 1.5em; line-height: 1.3; }
    .lead { margin: 0 0 0.6em; color: #555; }
    .note { margin: 0 0 0.6em; color: #777; font-size: 0.8em; }
    .top { display: flex; flex-wrap: wrap; align-items: center; gap: 0.4em 1em; margin: 0 0 0.6em; }
    .tabs { display: flex; flex-wrap: wrap; gap: 0.3em; }
    .tabs a { padding: 0.1em 0.7em; border: 1px solid #222; color: inherit; text-decoration: none; font-size: 0.7em; background: #fff; }
    #view { --fit: 1; flex: 1; min-height: 0; overflow: hidden; font-size: calc(1em * var(--fit)); }
    #view.scroll-y { overflow-y: auto; }
    .pager { display: flex; justify-content: flex-end; align-items: center; gap: 0.5em; font-size: 0.7em; color: #777; padding-top: 0.3em; }
    .pager[hidden] { display: none; }
    /* 何枚目かの表示は、桁が変わっても幅が変わらないようにする。幅は全体の枚数の桁から決める */
    .pager span { text-align: center; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .pager-bar { flex: 1; height: 4px; background: #eee; overflow: hidden; }
    .pager-bar div { height: 100%; background: #222; }
    .tabs a.on { background: #222; color: #fff; }
    button, input, select { font: inherit; }
    button { padding: 4px 12px; border: 1px solid #222; background: #fff; cursor: pointer; }
    button.on { background: #222; color: #fff; }
    button:disabled { opacity: 0.4; cursor: default; }
    button.on:disabled { opacity: 1; }
    input[type=text], textarea, select { padding: 0.2em 0.5em; border: 1px solid #999; background: #fff; font-size: 0.9em; }
    input[type=text] { width: min(100%, 22em); }
    textarea { width: 100%; font: inherit; font-size: 0.9em; }
    .row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.3em; margin: 0 0 0.5em; }
    button { font-size: 0.85em; }
    .chips button { font-size: 0.7em; padding: 0.1em 0.6em; border-color: #999; }
    svg { display: block; width: 100%; height: auto; }
    svg text { font-family: system-ui, sans-serif; }
    .talks { list-style: none; margin: 0; padding: 0; }
    .talks li { padding: 0.3em 0; border-top: 1px solid #ddd; }
    .talks .meta { font-size: 0.7em; color: #777; }
    .muted { color: #777; }
    table { border-collapse: collapse; width: 100%; font-size: 0.75em; }
    th, td { padding: 0.15em 0.4em; border-bottom: 1px solid #ddd; text-align: left; vertical-align: middle; }
    th { font-weight: normal; color: #777; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    .heat { table-layout: fixed; }
    .heat tr:first-child th:first-child { width: 7em; }
    .heat td.cell, .heat th.num { text-align: center; padding: 0.15em 0; }
    .heat tr[data-tech]:hover th { background: #eee; cursor: pointer; }
    .heat tr.open th { background: #eee; }
    .event p { margin: 0 0 0.6em; }
    .kata td.ex { color: #555; max-width: 0; width: 45%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .kata tr.open td { background: #eee; }
    .gen li { font-size: 1.1em; padding: 0.15em 0; }
    .quiz-q { font-size: 2em; font-weight: bold; line-height: 1.35; margin: 0.4em 0 0.6em; }
    .ans { margin: 0.6em 0; }
    .ans p { font-size: 0.8em; margin: 0.3em 0; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .bar-bg { background: #eee; height: 4px; }
    .bar-fg { background: #222; height: 4px; }
  </style>
</head>
<body>
  <main>
    <div class="top"><h1>YAPCトーク研究室</h1><nav class="tabs" id="tabs"></nav></div>
    <section id="view"><p class="lead">読み込み中…</p></section>
    <div class="pager" id="pager" hidden><div class="pager-bar"><div></div></div><button data-page="-1">←</button><span></span><button data-page="1">→</button></div>
  </main>

  <script>
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
    const pct = (a, b) => (b ? Math.round((a / b) * 1000) / 10 : 0);
    let D, talks = [], years = [], intro = '';
    // 長い一覧は PER 件ずつの1枚に分ける
    const PER = 7;
    const chunk = (list, n = PER) => { const out = []; for (let i = 0; i < list.length; i += n) out.push(list.slice(i, i + n)); return out; };
    // 一覧を何枚かに分け、1枚ずつに見出しをつける
    const listPages = (head, list, per = PER) => {
      const cs = chunk(list, per);
      return cs.map((c, i) => `<h2>${head}${cs.length > 1 ? ` <span class="muted" style="font-size:0.6em">${i + 1}/${cs.length}</span>` : ''}</h2><ul class="talks">${c.map(talkItem).join('')}</ul>`);
    };

    const TABS = [
      ['shime', '締め切りの日'],
      ['kotoba', 'ことばの移り変わり'],
      ['heat', '技術の年表'],
      ['kata', 'タイトルの型'],
      ['quiz', '何年のトーク？'],
      ['niteru', '似た話を探す'],
      ['nagasa', 'タイトルの長さ'],
      ['zenbu', '全部の一覧'],
    ];

    // 技術の年表に並べる言葉。左が表示名、右がタイトルに対する正規表現
    const TECH = [
      ['Perl', /perl|mojolicious|cpan|moose|plack|psgi/i],
      ['Ruby', /ruby|rails/i],
      ['Go', /\bgo\b|golang|go言語/i],
      ['Rust', /rust/i],
      ['TypeScript', /typescript|\bts\b/i],
      ['JavaScript', /javascript|\bjs\b|node\.?js|react|vue/i],
      ['PHP', /php/i],
      ['Python', /python/i],
      ['SQL・DB', /sql|mysql|postgres|データベース|\bdb\b/i],
      ['クラウド', /aws|gcp|google cloud|cloudflare|azure|クラウド|lambda/i],
      ['コンテナ', /docker|kubernetes|k8s|コンテナ|ecs/i],
      ['テスト', /テスト|test/i],
      ['設計', /設計|アーキテクチャ|architecture|ddd|ドメイン/i],
      ['セキュリティ', /セキュリティ|security|脆弱性|認証|identity/i],
      ['AI・LLM', /\bai\b|llm|生成ai|chatgpt|gpt|claude|copilot|エージェント|agent|mcp|バイブ/i],
      ['チーム・組織', /チーム|組織|マネジメント|マネージャ|team/i],
      ['キャリア', /キャリア|転職|新卒|若手|エンジニア人生/i],
      ['コミュニティ', /コミュニティ|community|勉強会|カンファレンス/i],
      ['個人開発・趣味', /個人開発|趣味|自作|作ってみた|遊び/i],
    ];

    // タイトルの型。左が名前、真ん中が見分け方、右が自分の話題を入れるときの形（{x} が話題）
    const KATA = [
      ['〜した話', /(した|してる|している|しました|やった|やってみた)話/, '{x}をやってみた話'],
      ['〜を作った', /(作った|作ってみた|作りました|つくった|作る)/, '{x}を作った'],
      ['〜入門', /入門|はじめて|初めて|はじめよう|始める/, 'はじめての{x}'],
      ['〜を支える技術', /支える技術/, '{x}を支える技術'],
      ['〜のすすめ', /すすめ|勧め|推し/, '{x}のすすめ'],
      ['〜で学ぶ', /で学ぶ|から学ぶ|学んだ/, '{x}で学ぶ○○'],
      ['なぜ〜のか', /なぜ|どうして|why/i, 'なぜ{x}なのか'],
      ['〜とは', /とは/, '{x}とは何だったのか'],
      ['〜年', /\d+\s*年/, '{x}を10年続けてわかったこと'],
      ['〜の現在地・いま', /現在地|いま|今の|最前線|最新/, '{x}の現在地'],
      ['〜の作り方・やり方', /(作り方|つくりかた|やり方|進め方|書き方|始め方|方法)/, '{x}の作り方'],
      ['〜しよう', /しよう|しましょう|ませんか/, '{x}をやってみませんか'],
      ['問いかけ（？）', /[?？]/, '{x}、どうしてますか？'],
      ['叫び（！）', /[!！]/, '{x}！'],
      ['副題つき（〜 ○○ 〜）', /〜.+〜|―|—|--| - /, '{x} 〜ある日の試行錯誤〜'],
      ['全部話します', /全部|すべて|ぜんぶ|総まとめ|まとめて/, '{x}について知っていることを全部話します'],
      ['英語だけ', /^[\x20-\x7e]+$/, null],
    ];

    // ---------- 締め切りの日 ----------
    const shimeView = () => {
      // 採択分だけが公開されている回は、応募の傾向にならないので外す
      const blocks = D.events.filter((e) => e.proposals > e.accepted).map((e) => {
        // 締め切りのあとに足された LT や企画は、グラフから外して件数だけ書く
        const top = e.days.reduce((a, b) => (b[1] > a[1] ? b : a))[0];
        const days = e.days.filter(([d]) => Date.parse(d) - Date.parse(top) <= 7 * 864e5);
        const later = e.days.filter((d) => !days.includes(d)).reduce((s, d) => s + d[1], 0);
        const t0 = Date.parse(days[0][0]);
        const t1 = Date.parse(days[days.length - 1][0]);
        const span = Math.round((t1 - t0) / 864e5) + 1;
        const peak = days.reduce((a, b) => (b[1] > a[1] ? b : a));
        const max = peak[1];
        const W = 900, H = 160, pad = 24, bw = (W - pad * 2) / span;
        const bars = days.map(([d, n]) => {
          const i = Math.round((Date.parse(d) - t0) / 864e5);
          const h = ((H - 40) * n) / max;
          const on = d === peak[0];
          return `<rect x="${pad + i * bw}" y="${H - 20 - h}" width="${Math.max(bw - 1, 1.5)}" height="${h}" fill="${on ? '#e06000' : '#bbb'}"><title>${d}：${n}件</title></rect>`;
        }).join('');
        const px = pad + Math.round((Date.parse(peak[0]) - t0) / 864e5) * bw;
        return `<div class="event">
          <h2>締め切りの日：${esc(e.name)}</h2>
          <p class="muted">応募 ${e.proposals}件。いちばん多い日（${peak[0]}）に <strong>${peak[1]}件</strong>（${pct(peak[1], e.proposals)}%）。この日の応募のうち ${peak[2]}件が採択されている${later ? `。それより後の日付の応募 ${later}件はグラフに入れていない` : ''}</p>
          <svg viewBox="0 0 ${W} ${H}">
            ${bars}
            <text x="${Math.min(px, W - 80)}" y="${H - 26 - (H - 40)}" font-size="14" fill="#e06000">${peak[1]}件</text>
            <text x="${pad}" y="${H - 4}" font-size="12" fill="#777">${days[0][0]}</text>
            <text x="${W - pad}" y="${H - 4}" font-size="12" fill="#777" text-anchor="end">${days[days.length - 1][0]}</text>
          </svg>
        </div>`;
      });
      return [`<h2>締め切りの日</h2>
        <p class="gen" style="font-size:1.4em">YAPC のトーク応募が、日ごとに何件あったか。<br>応募はいつも最後の日に集まります。</p>
        <p class="note">${esc(intro)}</p>
        <p class="note">締め切りの日のグラフは、fortee で応募の受け付け日時が公開されている回だけ。福岡2025は採択されたトークだけが公開されているので外しています。応募がいちばん多かった日から8日目以降の分は、LT の追加募集や企画など別の受け付けが混ざることがあるので、グラフから外しています。</p>`, ...blocks];
    };

    // ---------- ことばの移り変わり ----------
    let word = 'Perl';
    const matcher = (w) => {
      const parts = w.split(/\s+/).filter(Boolean).map((p) => p.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
      return parts.length ? new RegExp(parts.join('|'), 'i') : null;
    };
    const yearChart = (counts, label) => {
      const W = 900, H = 220, pad = 30, bw = (W - pad * 2) / years.length;
      const max = Math.max(...counts.map((c) => c.share), 1);
      return `<svg viewBox="0 0 ${W} ${H}">${counts.map((c, i) => {
        const h = ((H - 60) * c.share) / max;
        const x = pad + i * bw;
        return `<rect x="${x + 3}" y="${H - 30 - h}" width="${bw - 6}" height="${h}" fill="#222"><title>${c.year}：${c.hit} / ${c.all}</title></rect>
          <text x="${x + bw / 2}" y="${H - 34 - h}" font-size="13" text-anchor="middle">${c.hit ? `${c.share}%` : ''}</text>
          <text x="${x + bw / 2}" y="${H - 14}" font-size="12" text-anchor="middle" fill="#555">${c.year}</text>
          <text x="${x + bw / 2}" y="${H - 1}" font-size="10" text-anchor="middle" fill="#999">${c.hit}/${c.all}</text>`;
      }).join('')}</svg>`;
    };
    const kotobaView = () => {
      const re = matcher(word);
      const hits = re ? talks.filter((t) => re.test(t.title)) : [];
      const counts = years.map((y) => {
        const all = talks.filter((t) => t.year === y).length;
        const hit = hits.filter((t) => t.year === y).length;
        return { year: y, all, hit, share: pct(hit, all) };
      });
      const presets = ['Perl', 'Go', 'Rust', 'TypeScript', 'AI LLM', 'Docker', 'Kubernetes', 'テスト', '設計', 'チーム', '組織', 'キャリア', '入門', '個人開発', 'ゲーム', '話', '技術', '僕 私 俺'];
      return [`<h2>ことばの移り変わり</h2>
        <p class="lead">トークのタイトルに、その言葉が入っている割合を年ごとに。スペースで区切るといずれかを含むものを数えます。</p>
        <div class="row"><input type="text" id="word" value="${esc(word)}" placeholder="言葉を入れる"> <span class="muted">${hits.length}件。→ で一覧</span></div>
        <div class="row chips">${presets.map((p) => `<button data-word="${esc(p)}" class="${p === word ? 'on' : ''}">${esc(p)}</button>`).join('')}</div>
        ${yearChart(counts)}`, ...listPages(`「${esc(word)}」を含むトーク`, hits.slice().reverse().slice(0, 70))];
    };

    // ---------- 技術の年表 ----------
    let openTech = null;
    const heatView = () => {
      const all = years.map((y) => talks.filter((t) => t.year === y));
      const rowsOf = (part) => part.map(([label, re]) => {
        const cells = all.map((list) => {
          const n = list.filter((t) => re.test(t.title)).length;
          const s = list.length ? n / list.length : 0;
          return `<td class="cell" style="background: rgba(240,180,0,${Math.min(s * 5, 1)})" title="${n} / ${list.length}">${n || ''}</td>`;
        }).join('');
        return `<tr data-tech="${esc(label)}" class="${openTech === label ? 'open' : ''}"><th>${esc(label)}</th>${cells}</tr>`;
      }).join('');
      // 言語と、それ以外の話題で2枚に分ける
      const LANGS = 9;
      const table = (part) => `<table class="heat"><tr><th></th>${years.map((y) => `<th class="num">${y}</th>`).join('')}</tr>${rowsOf(part)}
        <tr><th class="muted">トーク数</th>${all.map((l) => `<td class="cell muted">${l.length}</td>`).join('')}</tr></table>`;
      const re = openTech && TECH.find((x) => x[0] === openTech)[1];
      const list = re ? listPages(`${esc(openTech)}`, talks.filter((t) => re.test(t.title)).reverse()) : [];
      const inLangs = openTech && TECH.findIndex((x) => x[0] === openTech) < LANGS;
      return [`<h2>技術の年表：言語</h2>
        <p class="note">タイトルに出てくる技術や話題を年ごとに数えました。数字は件数、色の濃さはその年のトークに占める割合。言葉で機械的に数えているので、取りこぼしや数えすぎがあります。行を押すと、その行のトークを次の1枚から出します。</p>
        ${table(TECH.slice(0, LANGS))}`, ...(inLangs ? list : []),
        `<h2>技術の年表：話題</h2>${table(TECH.slice(LANGS))}`, ...(inLangs ? [] : list)];
    };

    // ---------- タイトルの型 ----------
    let openKata = null, topic = '';
    const kataView = () => {
      const rowsOf = (from, to) => KATA.slice(from, to).map(([label, re], j) => {
        const i = from + j;
        const hits = talks.filter((t) => re.test(t.title));
        const ex = hits.length ? hits[Math.floor(Math.random() * hits.length)].title : '';
        const spark = years.map((y) => {
          const n = talks.filter((t) => t.year === y).length;
          const h = n ? hits.filter((t) => t.year === y).length / n : 0;
          return h;
        });
        const m = Math.max(...spark, 0.01);
        const svg = `<svg viewBox="0 0 ${years.length * 8} 20" style="width:${years.length * 8}px">${spark.map((h, j) => `<rect x="${j * 8}" y="${20 - (20 * h) / m}" width="6" height="${(20 * h) / m}" fill="#222"/>`).join('')}</svg>`;
        return `<tr data-kata="${i}" class="${openKata === i ? 'open' : ''}" style="cursor:pointer">
          <td>${esc(label)}</td><td class="num">${hits.length}</td><td>${svg}</td><td class="ex">${esc(ex)}</td></tr>`;
      }).join('');
      const open = openKata !== null ? listPages(esc(KATA[openKata][0]), talks.filter((t) => KATA[openKata][1].test(t.title)).reverse()) : [];
      const HALF = Math.ceil(KATA.length / 2);
      const table = (from, to) => `<table class="kata"><tr><th>型</th><th class="num">件数</th><th>${years[0]}〜${years[years.length - 1]}</th><th>例</th></tr>${rowsOf(from, to)}</table>`;
      const first = openKata !== null && openKata < HALF;
      return [`<h2>タイトルの型 <span class="muted" style="font-size:0.6em">1/2</span></h2>
        <p class="note">過去のタイトルを、よく使われる言い回しで分けました。行を押すと、その型のトークを次の1枚から出します。</p>
        ${table(0, HALF)}`, ...(first ? open : []),
        `<h2>タイトルの型 <span class="muted" style="font-size:0.6em">2/2</span></h2>${table(HALF, KATA.length)}`, ...(openKata !== null && !first ? open : []),
        `<h2>型を借りる</h2>
        <p class="lead">話したいことを一言で入れると、型に当てはめたタイトルを並べます。</p>
        <div class="row"><input type="text" id="topic" value="${esc(topic)}" placeholder="例：家の電気代"></div>
        <ul class="talks gen" id="gen">${genList()}</ul>`];
    };
    const genList = () => (topic.trim()
      ? KATA.filter((k) => k[2]).map((k) => `<li>${esc(k[2].replace('{x}', topic.trim()))}</li>`).join('')
      : '');

    // ---------- 何年のトーク？ ----------
    let quiz = null, score = { ok: 0, all: 0 };
    const nextQuiz = () => { quiz = { t: talks[Math.floor(Math.random() * talks.length)], answer: null }; };
    const quizView = () => {
      if (!quiz) nextQuiz();
      const t = quiz.t;
      const ans = quiz.answer;
      return [`<h2>何年のトーク？ <span class="muted" style="font-size:0.6em">${score.ok} / ${score.all} 正解</span></h2>
        <p class="lead">YAPC に応募されたタイトルを1つ出します。何年のものか当ててください。</p>
        <p class="quiz-q">${esc(t.title)}</p>
        <div class="row">${years.map((y) => `<button data-year="${y}" ${ans !== null ? 'disabled' : ''} class="${ans !== null && y === t.year ? 'on' : ''}">${y}</button>`).join('')}</div>
        ${ans !== null ? `<div class="ans">${ans === t.year ? '正解' : `ちがいます。${t.year}年`}：${esc(t.event)}${t.speaker ? `／${esc(t.speaker)}` : ''} ${t.url ? `<a href="${esc(t.url)}" target="_blank" rel="noopener">ページ</a>` : ''}
          ${t.abstract ? `<p class="muted">${esc(t.abstract)}</p>` : ''}</div>
          <button data-next>次の問題</button>` : ''}`];
    };

    // ---------- 似た話を探す ----------
    // 文字の2文字組（bigram）で、タイトルと概要の近さを測る
    let index = null, idea = '';
    const grams = (s) => {
      const t = s.toLowerCase().replace(/\s+/g, ' ');
      const m = new Map();
      for (let i = 0; i < t.length - 1; i++) {
        const g = t.slice(i, i + 2);
        if (/^[\s\p{P}]+$/u.test(g)) continue;
        m.set(g, (m.get(g) || 0) + 1);
      }
      return m;
    };
    const buildIndex = () => {
      const docs = talks.map((t) => grams(`${t.title} ${t.title} ${t.abstract}`));
      const df = new Map();
      docs.forEach((d) => d.forEach((_, g) => df.set(g, (df.get(g) || 0) + 1)));
      const idf = (g) => Math.log((docs.length + 1) / ((df.get(g) || 0) + 1));
      const vecs = docs.map((d) => {
        const v = new Map();
        let norm = 0;
        d.forEach((n, g) => { const w = (1 + Math.log(n)) * idf(g); v.set(g, w); norm += w * w; });
        return { v, norm: Math.sqrt(norm) || 1 };
      });
      index = { vecs, idf };
    };
    const search = (q) => {
      if (!index) buildIndex();
      const qv = new Map();
      let qn = 0;
      grams(q).forEach((n, g) => { const w = (1 + Math.log(n)) * index.idf(g); qv.set(g, w); qn += w * w; });
      qn = Math.sqrt(qn) || 1;
      return index.vecs.map(({ v, norm }, i) => {
        let dot = 0;
        qv.forEach((w, g) => { const x = v.get(g); if (x) dot += w * x; });
        return { t: talks[i], s: dot / norm / qn };
      }).sort((a, b) => b.s - a.s).slice(0, 15);
    };
    const niteruItems = (res) => {
      const max = res[0]?.s || 1;
      return res.map(({ t, s }) => `<li>
        <div class="bar-bg"><div class="bar-fg" style="width:${Math.round((s / max) * 100)}%"></div></div>
        ${talkBody(t)}</li>`);
    };
    const niteruView = () => {
      const res = idea.trim() ? niteruItems(search(idea)) : [];
      const cs = chunk(res, 5);
      return [`<h2>似た話を探す</h2>
      <p class="lead">話したいことを書くと、過去の YAPC のタイトルと概要から、言葉の近いものを15件出します（→ で続き）。近い話が見つかったら、入口にしたり、違うところを話の芯にしたりできます。</p>
      <textarea id="idea" rows="2" placeholder="例：家の Wi-Fi が夜だけ遅いので、ルーターのログを集めて調べた">${esc(idea)}</textarea>
      <div class="row" style="margin-top:0.3em"><button data-search>探す</button><button data-lucky>過去のタイトルを1つ入れてみる</button></div>
      ${cs[0] ? `<ul class="talks">${cs[0].join('')}</ul>` : ''}`,
      ...cs.slice(1).map((c, i) => `<h2>似た話 <span class="muted" style="font-size:0.6em">${i + 2}/${cs.length}</span></h2><p class="muted">${esc(idea)}</p><ul class="talks">${c.join('')}</ul>`)];
    };

    // ---------- タイトルの長さ ----------
    const nagasaView = () => {
      const len = (t) => [...t.title].length;
      const med = (a) => { const s = a.slice().sort((x, y) => x - y); return s.length ? s[Math.floor(s.length / 2)] : 0; };
      const stats = years.map((y) => {
        const list = talks.filter((t) => t.year === y);
        return { year: y, all: list.length, med: med(list.map(len)), en: pct(list.filter((t) => /^[\x20-\x7e]+$/.test(t.title)).length, list.length) };
      });
      const W = 900, H = 200, pad = 30, bw = (W - pad * 2) / years.length;
      const max = Math.max(...stats.map((s) => s.med), 1);
      const chart = `<svg viewBox="0 0 ${W} ${H}">${stats.map((s, i) => {
        const h = ((H - 60) * s.med) / max;
        const x = pad + i * bw;
        return `<rect x="${x + 3}" y="${H - 30 - h}" width="${bw - 6}" height="${h}" fill="#222"/>
          <text x="${x + bw / 2}" y="${H - 34 - h}" font-size="13" text-anchor="middle">${s.med}字</text>
          <text x="${x + bw / 2}" y="${H - 14}" font-size="12" text-anchor="middle" fill="#555">${s.year}</text>
          <text x="${x + bw / 2}" y="${H - 1}" font-size="10" text-anchor="middle" fill="#999">英語のみ ${s.en}%</text>`;
      }).join('')}</svg>`;
      const sorted = talks.slice().sort((a, b) => len(a) - len(b));
      return [`<h2>タイトルの長さ</h2>
        <p class="lead">タイトルの文字数の中央値を年ごとに。下の段は、英数字だけで書かれたタイトルの割合です。</p>
        ${chart}`, ...listPages('短いタイトル', sorted.slice(0, 14)), ...listPages('長いタイトル', sorted.slice(-8).reverse(), 4)];
    };

    // ---------- 全部の一覧 ----------
    let filter = { year: '', q: '' };
    // 絞り込みの欄は、どの1枚にも出す。めくった先でも絞り込める
    const zenbuView = () => {
      const re = filter.q ? matcher(filter.q) : null;
      const list = talks.filter((t) => (!filter.year || t.year === Number(filter.year)) && (!re || re.test(`${t.title} ${t.speaker} ${t.abstract}`)));
      const head = `<h2>全部の一覧 <span class="muted" style="font-size:0.6em">${list.length}件（全${talks.length}件。2024年以降は採択されなかった応募も含む）</span></h2>
      <div class="row">
        <select id="f-year"><option value="">すべての年</option>${years.map((y) => `<option ${String(y) === filter.year ? 'selected' : ''}>${y}</option>`).join('')}</select>
        <input type="text" id="f-q" value="${esc(filter.q)}" placeholder="タイトル・名前・概要で絞り込む">
      </div>`;
      const cs = chunk(list, 6);
      return cs.length ? cs.map((c) => `${head}<ul class="talks">${c.map(talkItem).join('')}</ul>`) : [head];
    };

    // ---------- 共通 ----------
    const KIND = { lt: 'LT', keynote: '基調講演' };
    const talkBody = (t) => `<div>${t.url ? `<a href="${esc(t.url)}" target="_blank" rel="noopener">${esc(t.title)}</a>` : esc(t.title)}</div>
      <div class="meta">${esc(t.event)}${t.speaker ? `／${esc(t.speaker)}` : ''}${KIND[t.kind] ? `／${KIND[t.kind]}` : ''}${t.length ? `／${t.length}分` : ''}</div>`;
    const talkItem = (t) => `<li>${talkBody(t)}</li>`;

    const VIEWS = { shime: shimeView, kotoba: kotobaView, heat: heatView, kata: kataView, quiz: quizView, niteru: niteruView, nagasa: nagasaView, zenbu: zenbuView };
    // URL は #タブ または #タブ/ページ番号
    const tab = () => { const k = location.hash.slice(1).split('/')[0]; return VIEWS[k] ? k : 'shime'; };
    const pageNo = {};
    const fromHash = location.hash.match(/^#(\w+)\/(\d+)$/);
    if (fromHash) pageNo[fromHash[1]] = Number(fromHash[2]) - 1;
    const view = document.getElementById('view');
    const pager = document.getElementById('pager');

    // はみ出したら文字を少しずつ縮める。それでも入らなければ、その1枚だけ縦にスクロールさせる
    const MIN_FIT = 0.6;
    const fit = () => {
      let f = 1;
      view.classList.remove('scroll-y');
      view.style.setProperty('--fit', f);
      const over = () => view.scrollHeight > view.clientHeight + 1 || view.scrollWidth > view.clientWidth + 1;
      while (over() && f > MIN_FIT) { f = Math.max(MIN_FIT, f * 0.92); view.style.setProperty('--fit', f); }
      if (over()) view.classList.add('scroll-y');
    };
    new ResizeObserver(() => fit()).observe(view);

    const render = () => {
      const t = tab();
      const pages = VIEWS[t]();
      const n = (pageNo[t] = Math.min(Math.max(pageNo[t] || 0, 0), pages.length - 1));
      document.getElementById('tabs').innerHTML = TABS.map(([k, l]) => `<a href="#${k}" class="${k === t ? 'on' : ''}">${l}</a>`).join('');
      view.innerHTML = pages[n];
      view.scrollTop = 0;
      pager.hidden = pages.length < 2;
      pager.querySelector('span').textContent = `${n + 1} / ${pages.length}`;
      pager.querySelector('span').style.minWidth = `${String(pages.length).length * 2 + 3}ch`;
      pager.querySelector('.pager-bar div').style.width = `${((n + 1) / pages.length) * 100}%`;
      pager.querySelector('[data-page="-1"]').disabled = n === 0;
      pager.querySelector('[data-page="1"]').disabled = n === pages.length - 1;
      fit();
    };
    const go = (d) => {
      const t = tab();
      pageNo[t] = (pageNo[t] || 0) + d;
      render();
      history.replaceState(null, '', `#${t}/${pageNo[t] + 1}`);
    };
    // 1枚目に戻して描き直す（言葉や絞り込みを変えたとき）
    const reset = (t, keepFocus) => { pageNo[t] = 0; rerender(keepFocus); };
    // スマホでは左右のスワイプでもめくる
    let touch = null;
    view.addEventListener('touchstart', (e) => { touch = e.touches[0]; }, { passive: true });
    view.addEventListener('touchend', (e) => {
      const t = e.changedTouches[0];
      if (!touch || /input|textarea|select/i.test(e.target.tagName)) return;
      const dx = t.clientX - touch.clientX, dy = t.clientY - touch.clientY;
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
      touch = null;
    });
    pager.addEventListener('click', (e) => { const b = e.target.closest('[data-page]'); if (b) go(Number(b.dataset.page)); });
    addEventListener('keydown', (e) => {
      if (/input|textarea|select/i.test(document.activeElement?.tagName || '')) return;
      if (['ArrowRight', 'PageDown'].includes(e.key)) { e.preventDefault(); go(1); }
      if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); go(-1); }
    });
    const rerender = (keepFocus) => {
      const id = document.activeElement?.id;
      const pos = document.activeElement?.selectionStart;
      render();
      if (keepFocus && id) { const el = document.getElementById(id); el?.focus(); if (pos != null) el.setSelectionRange?.(pos, pos); }
    };

    view.addEventListener('click', (e) => {
      const w = e.target.closest('[data-word]');
      if (w) { word = w.dataset.word; reset('kotoba'); }
      // 行を押したら、その行の一覧（次の1枚）へめくる
      const h = e.target.closest('[data-tech]');
      if (h) { openTech = openTech === h.dataset.tech ? null : h.dataset.tech; render(); if (openTech) go(1); }
      const k = e.target.closest('[data-kata]');
      if (k && !e.target.closest('a')) { const i = Number(k.dataset.kata); openKata = openKata === i ? null : i; render(); if (openKata !== null) go(1); }
      const y = e.target.closest('[data-year]');
      if (y) { quiz.answer = Number(y.dataset.year); score.all++; if (quiz.answer === quiz.t.year) score.ok++; rerender(); }
      if (e.target.closest('[data-next]')) { nextQuiz(); rerender(); }
      if (e.target.closest('[data-search]')) { idea = document.getElementById('idea').value; reset('niteru'); }
      if (e.target.closest('[data-lucky]')) { idea = talks[Math.floor(Math.random() * talks.length)].title; reset('niteru'); }
    });
    view.addEventListener('input', (e) => {
      // 変換中に描き直すと入力欄が作り直されて変換が切れるので、確定（compositionend）まで待つ
      if (e.isComposing) return;
      if (e.target.id === 'word') { word = e.target.value; reset('kotoba', true); }
      if (e.target.id === 'topic') { topic = e.target.value; document.getElementById('gen').innerHTML = genList(); fit(); }
      if (e.target.id === 'f-q' || e.target.id === 'f-year') {
        filter = { year: document.getElementById('f-year').value, q: document.getElementById('f-q').value };
        reset('zenbu', true);
      }
    });
    view.addEventListener('compositionend', (e) => {
      if (e.target.id === 'word') { word = e.target.value; reset('kotoba', true); }
      if (e.target.id === 'topic') { topic = e.target.value; document.getElementById('gen').innerHTML = genList(); fit(); }
      if (e.target.id === 'f-q') { filter.q = e.target.value; reset('zenbu', true); }
    });
    view.addEventListener('keydown', (e) => {
      if (e.target.id === 'idea' && e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { idea = e.target.value; reset('niteru'); }
    });
    // タブを押したとき（#タブ だけのとき）は、そのタブの1枚目から
    addEventListener('hashchange', () => {
      const m = location.hash.match(/^#(\w+)(?:\/(\d+))?$/);
      if (m) pageNo[m[1]] = m[2] ? Number(m[2]) - 1 : 0;
      render();
    });

    (async () => {
      D = await (await fetch('data/yapc-talks.json')).json();
      talks = D.talks;
      years = [...new Set(talks.map((t) => t.year))].sort((a, b) => a - b);
      const events = new Set(talks.map((t) => t.event)).size;
      intro = `過去の YAPC ${events}回分、${talks.length}件のトークのタイトルを集めて、数えたり並べたりしてみました。2023年までは採択されたトーク、2024年以降は採択されなかった応募も含みます。LT のタイトルが公開されていない年もあります。上のタブで切り替え、←→ でめくります。`;
      render();
    })();
  </script>
</body>
</html>
