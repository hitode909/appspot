<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>発表のタネ図鑑</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #fffdf5;
      color: #222;
    }
    a { color: inherit; }
    header {
      position: sticky;
      top: 0;
      z-index: 1;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      background: #fffdf5ee;
      border-bottom: 2px solid #222;
    }
    header h1 { margin: 0 12px 0 0; font-size: 20px; }
    header h1 a { text-decoration: none; }
    .crumbs { flex: 1; font-size: 14px; }
    .crumbs a { margin-right: 4px; }
    header button { font-size: 14px; padding: 6px 12px; cursor: pointer; }
    main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
    .lead { margin: 0 0 20px; color: #555; }
    h2 { margin: 0 0 8px; font-size: 28px; }

    /* ぷりんと出てくる */
    @keyframes purin {
      0% { transform: scale(0.2); opacity: 0; }
      55% { transform: scale(1.12, 0.92); opacity: 1; }
      75% { transform: scale(0.95, 1.06); }
      90% { transform: scale(1.02, 0.98); }
      100% { transform: scale(1); }
    }
    .pop { animation: purin 0.55s ease-out both; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
    }
    .grid > a { display: block; text-decoration: none; }
    .tile {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
      min-height: 110px;
      padding: 16px;
      border: 2px solid var(--line);
      border-radius: 18px;
      background: var(--bg);
      text-decoration: none;
      font-weight: bold;
      font-size: 18px;
      line-height: 1.4;
      cursor: pointer;
    }
    .tile:hover { transform: translateY(-2px) rotate(-0.5deg); }
    .tile small { font-weight: normal; font-size: 13px; color: #555; }
    .tile.theme { font-size: 16px; min-height: 90px; }
    .tile.theme.kojitsuke::after { content: "こじつけ"; font-size: 11px; font-weight: normal; color: #a33; }

    .card {
      padding: 24px;
      border: 3px solid var(--line);
      border-radius: 24px;
      background: var(--bg);
      margin-bottom: 32px;
    }
    .card .theme-text { font-size: clamp(24px, 4vw, 40px); font-weight: bold; line-height: 1.4; margin: 0 0 16px; }
    .card p { margin: 0 0 12px; line-height: 1.6; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
    .chip {
      display: inline-block;
      padding: 4px 12px;
      border: 2px solid #222;
      border-radius: 999px;
      background: #fff;
      text-decoration: none;
      font-size: 14px;
    }
    .chip:hover { background: #fff3c4; }
    h3 { margin: 32px 0 12px; font-size: 18px; }
  </style>
</head>
<body>
  <header>
    <h1><a href="#/">発表のタネ図鑑</a></h1>
    <nav class="crumbs" id="crumbs"></nav>
    <button id="random">ランダムに1つ</button>
  </header>
  <main id="main">読み込み中…</main>

  <script>
    let data;
    const seedById = {};
    const verbById = {};
    const themeById = {};
    const themesBySeed = {};
    const themesByVerb = {};
    const themesByPost = {};

    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
    // 記事の BASENAME（2023/12/18/235900 や 20110830/1314320402）から日付を取り出す
    const postDate = (basename) => {
      const m = basename.match(/^(\d{4})\/(\d{2})\/(\d{2})\//) || basename.match(/^(\d{4})(\d{2})(\d{2})\//);
      return m ? `${Number(m[1])}年${Number(m[2])}月${Number(m[3])}日` : '';
    };
    const shuffle = (a) => a.map((x) => [Math.random(), x]).sort((p, q) => p[0] - q[0]).map((p) => p[1]);

    // ジャンルごとに色相を割り当てる
    const genreIndex = (name) => data.genres.findIndex((g) => g.name === name);
    const colors = (genre) => {
      const h = (genreIndex(genre) * 360 / data.genres.length + 20) % 360;
      return `--bg: hsl(${h} 90% 90%); --line: hsl(${h} 55% 40%);`;
    };

    // 子要素を少しずつ遅らせて、ぷりんと出す
    const pop = (i) => `class="pop" style="animation-delay: ${Math.min(i, 40) * 25}ms"`;

    const themeTile = (t, i) =>
      `<a ${pop(i)} href="#/t/${t.id}"><div class="tile theme ${t.kojitsuke ? 'kojitsuke' : ''}" style="${colors(seedById[t.seed].genre)}">${esc(t.theme)}</div></a>`;

    const views = {
      home() {
        const html = data.genres.map((g, i) => {
          const n = data.seeds.filter((s) => s.genre === g.name).reduce((sum, s) => sum + themesBySeed[s.id].length, 0);
          return `<a ${pop(i)} href="#/g/${i}"><div class="tile" style="${colors(g.name)}">${esc(g.name)}<small>${n}件</small></div></a>`;
        }).join('');
        return {
          crumbs: [],
          html: `<p class="lead">hitode909 のブログから集めた発表のタネ ${data.themes.length}件。気になるところを押すと、中身が出てきます。</p><div class="grid">${html}</div>`,
        };
      },
      g(i) {
        const g = data.genres[Number(i)];
        const seeds = data.seeds.filter((s) => s.genre === g.name);
        const html = seeds.map((s, j) =>
          `<a ${pop(j)} href="#/s/${s.id}"><div class="tile" style="${colors(g.name)}">${esc(s.name)}<small>${themesBySeed[s.id].length}件</small></div></a>`
        ).join('');
        return {
          crumbs: [[g.name]],
          html: `<h2 class="pop">${esc(g.name)}</h2><p class="lead">${esc(g.description)}</p><div class="grid">${html}</div>`,
        };
      },
      s(id) {
        const s = seedById[id];
        const gi = genreIndex(s.genre);
        const html = themesBySeed[id].map(themeTile).join('');
        return {
          crumbs: [[s.genre, `#/g/${gi}`], [s.name]],
          html: `<h2 class="pop">${esc(s.name)}</h2><p class="lead">${esc(s.description)}</p><div class="grid">${html}</div>`,
        };
      },
      t(id) {
        const t = themeById[id];
        const s = seedById[t.seed];
        const gi = genreIndex(s.genre);
        const verbs = t.verbs.map((v) => `<a class="chip" href="#/v/${v}">${esc(verbById[v].name)}</a>`).join('');
        const siblings = shuffle(themesBySeed[t.seed].filter((x) => x !== t)).slice(0, 8);
        const samePost = themesByPost[t.basename].filter((x) => x !== t);
        // 同じ動詞を持つ、別のジャンルのテーマ
        const crossGenre = shuffle(t.verbs.flatMap((v) => themesByVerb[v])
          .filter((x) => seedById[x.seed].genre !== s.genre)).slice(0, 8);
        const section = (title, list) => list.length ? `<h3>${title}</h3><div class="grid">${list.map(themeTile).join('')}</div>` : '';
        return {
          crumbs: [[s.genre, `#/g/${gi}`], [s.name, `#/s/${s.id}`], ['テーマ']],
          html: `
            <div class="card pop" style="${colors(s.genre)}">
              <p class="theme-text">${esc(t.theme)}</p>
              <p>${postDate(t.basename)} <a href="https://blog.sushi.money/entry/${t.basename}" target="_blank" rel="noopener">${esc(t.title)}</a></p>
              <p>${esc(t.why)}</p>
              <div class="chips">${verbs}</div>
            </div>
            ${section('同じ種のテーマ', siblings)}
            ${section('同じ操作の、別ジャンルのテーマ', crossGenre)}
            ${section('同じ記事から出たテーマ', samePost)}`,
        };
      },
      v(id) {
        const v = verbById[id];
        const list = shuffle(themesByVerb[id]).slice(0, 60);
        return {
          crumbs: [[`操作：${v.name}`]],
          html: `<h2 class="pop">${esc(v.name)}</h2><p class="lead">「${esc(v.name)}」が入ったテーマ ${themesByVerb[id].length}件から、ランダムに${list.length}件。</p><div class="grid">${list.map(themeTile).join('')}</div>`,
        };
      },
    };

    const render = () => {
      const [, kind, arg] = location.hash.match(/^#\/(\w)\/([\w-]+)$/) || [];
      const view = kind && views[kind] ? views[kind](arg) : views.home();
      document.getElementById('crumbs').innerHTML = view.crumbs
        .map(([label, href]) => href ? `<a href="${href}">${esc(label)}</a> ›` : esc(label)).join(' ');
      document.getElementById('main').innerHTML = view.html;
      scrollTo(0, 0);
    };

    document.getElementById('random').addEventListener('click', () => {
      const t = data.themes[Math.floor(Math.random() * data.themes.length)];
      location.hash = `#/t/${t.id}`;
    });
    addEventListener('hashchange', render);

    (async () => {
      data = await (await fetch('data/catalog.json')).json();
      data.themes = data.themes.map(([id, theme, seed, verbs, title, basename, why, kojitsuke]) =>
        ({ id, theme, seed, verbs, title, basename, why, kojitsuke }));
      data.seeds.forEach((s) => { seedById[s.id] = s; themesBySeed[s.id] = []; });
      data.verbs.forEach((v) => { verbById[v.id] = v; themesByVerb[v.id] = []; });
      data.themes.forEach((t) => {
        themeById[t.id] = t;
        themesBySeed[t.seed].push(t);
        t.verbs.forEach((v) => themesByVerb[v].push(t));
        (themesByPost[t.basename] ||= []).push(t);
      });
      render();
    })();
  </script>
</body>
</html>
