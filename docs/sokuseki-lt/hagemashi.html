<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>はげましの一言</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #fff; color: #222; line-height: 1.6; }
    a { color: #0a58ca; }
    main { max-width: 900px; margin: 0 auto; padding: 24px 16px 80px; }
    h1 { margin: 0 0 4px; font-size: 26px; }
    .lead { margin: 0 0 24px; color: #555; }
    button { font: inherit; padding: 6px 14px; border: 1px solid #222; border-radius: 999px; background: #fff; color: inherit; cursor: pointer; }

    /* 一覧 */
    .toc { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 24px; }
    .toc a { padding: 4px 12px; border: 1px solid #222; border-radius: 999px; color: inherit; text-decoration: none; font-size: 14px; background: #fff; }
    h2 { margin: 40px 0 4px; font-size: 22px; border-bottom: 2px solid #222; padding-bottom: 4px; }
    .chapter-lead { margin: 0 0 12px; color: #555; font-size: 14px; }
    .words { list-style: none; margin: 0; padding: 0; }
    .words a { display: block; padding: 10px 12px; border-bottom: 1px solid #ddd; color: inherit; text-decoration: none; }
    .words a:hover { background: #fff3c4; }
    .words .text { font-size: 18px; }
    .words .step { font-size: 14px; color: #555; }

    /* 一言 */
    .nav { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 16px; font-size: 14px; }
    .nav a { color: #555; }
    .nav .step { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .filter { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 32px; font-size: 14px; }
    .filter button { padding: 2px 10px; border-color: #999; }
    .filter button.on { background: #222; border-color: #222; color: #fff; }
    .chapter-name { margin: 0; font-size: 14px; color: #777; }
    .word { margin: 8px 0 32px; font-size: clamp(28px, 6vw, 60px); font-weight: bold; line-height: 1.4; }
    .next { margin: 0; padding: 16px 20px; border: 2px solid #222; border-radius: 16px; background: #fff; }
    .next .label { margin: 0 0 4px; font-size: 14px; color: #777; }
    .next .body { margin: 0; font-size: clamp(18px, 3vw, 30px); }
  </style>
</head>
<body>
  <main id="main">読み込み中…</main>

  <script>
    let categories = [], flat = [];
    // 絞り込んでいる分類の名前。null なら全部から引く
    let only = null;
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);

    const listView = () => `
      <h1>はげましの一言</h1>
      <p class="lead">発表をためらっているときに引く一言を ${flat.length}個。それぞれに、すぐできる「次の一歩」が付いています。</p>
      <p class="nav"><button data-omikuji>1つ引く</button></p>
      <nav class="toc">${categories.map((c, i) => `<a href="#c${i}">${esc(c.name)}</a>`).join('')}</nav>
      ${categories.map((c, i) => `
        <h2 id="c${i}">${esc(c.name)}</h2>
        <p class="chapter-lead">${esc(c.lead)}</p>
        <ul class="words">${c.items.map((w) => `<li><a href="#/${w.n}"><div class="text">${esc(w.text)}</div><div class="step">→ ${esc(w.step)}</div></a></li>`).join('')}</ul>`).join('')}`;

    const wordView = (w) => {
      const p = pool(), i = p.indexOf(w);
      return `
      <div class="nav">
        <a href="#list">一覧を見る</a>
        <div class="step">
          <button data-omikuji>もう1つ</button>
          <button data-go="${i - 1}" ${i <= 0 ? 'disabled' : ''}>←</button>
          <span>${i + 1} / ${p.length}</span>
          <button data-go="${i + 1}" ${i < 0 || i >= p.length - 1 ? 'disabled' : ''}>→</button>
        </div>
      </div>
      <div class="filter">
        <button data-only="" class="${only === null ? 'on' : ''}">すべて</button>
        ${categories.map((c) => `<button data-only="${esc(c.name)}" class="${only === c.name ? 'on' : ''}">${esc(c.name)}</button>`).join('')}
      </div>
      <p class="chapter-name">${esc(w.category)}</p>
      <p class="word">${esc(w.text)}</p>
      <div class="next">
        <p class="label">次の一歩</p>
        <p class="body">${esc(w.step)}</p>
      </div>`;
    };

    const pool = () => flat.filter((w) => only === null || w.category === only);
    const current = () => { const m = location.hash.match(/^#\/(\d+)$/); return m ? flat[Number(m[1]) - 1] : null; };
    // いま見ている一言以外から1つ選ぶ
    const draw = () => {
      const now = current();
      const p = pool().filter((w) => w !== now);
      return p[Math.floor(Math.random() * p.length)].n;
    };
    const show = (n) => { if (location.hash === `#/${n}`) render(); else location.hash = `#/${n}`; };
    const render = () => {
      // 最初の画面では、1つ引いて出す
      if (/^#?\/?$/.test(location.hash)) return location.replace(`#/${draw()}`);
      const w = current();
      // 分類へのリンク（#c3 など）は一覧の中の移動なので、描き直さない
      if (!w && /^#c\d+$/.test(location.hash) && document.getElementById(location.hash.slice(1))) return;
      document.getElementById('main').innerHTML = w ? wordView(w) : listView();
      if (w) scrollTo(0, 0);
      else if (/^#c\d+$/.test(location.hash)) document.getElementById(location.hash.slice(1))?.scrollIntoView();
    };
    // 絞り込んだ中での i 番目へ移る
    const go = (i) => { const p = pool(); if (i >= 0 && i < p.length) show(p[i].n); };
    const step = (d) => { const w = current(); if (w) go(pool().indexOf(w) + d); };

    document.getElementById('main').addEventListener('click', (e) => {
      const b = e.target.closest('button[data-go]');
      if (b) go(Number(b.dataset.go));
      if (e.target.closest('button[data-omikuji]')) show(draw());
      const f = e.target.closest('button[data-only]');
      if (f) {
        only = f.dataset.only || null;
        // 絞り込んだ分類の外を見ていたら、その分類から引き直す
        const w = current();
        show(w && pool().includes(w) ? w.n : draw());
      }
    });
    addEventListener('keydown', (e) => {
      if (!current()) return;
      if (e.key === 'ArrowRight') step(1);
      if (e.key === 'ArrowLeft') step(-1);
      if (e.key === 'Escape') location.hash = '#list';
    });
    addEventListener('hashchange', render);

    (async () => {
      categories = (await (await fetch('data/hagemashi.json')).json()).categories;
      categories.forEach((c) => c.items.forEach((w) => { w.category = c.name; w.n = flat.push(w); }));
      render();
    })();
  </script>
</body>
</html>
