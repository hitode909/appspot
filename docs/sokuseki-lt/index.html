<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>即席LT大会</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #fffdf5;
      color: #222;
    }
    a { color: #0a58ca; }

    /* 一覧 */
    #list { padding: 24px 16px; max-width: 1100px; margin: 0 auto; }
    #list h1 { margin: 0 0 16px; }
    .tools { display: flex; gap: 8px; margin-bottom: 16px; }
    .tools button { font-size: 16px; padding: 8px 16px; cursor: pointer; }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 12px;
    }
    .card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
      min-height: 96px;
      border: 2px solid #222;
      border-radius: 8px;
      background: #fff;
      color: inherit;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
    }
    .card:hover { background: #fff3c4; }
    .card .play { font-size: 28px; }

    /* 再生 */
    #player {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      background: #fffdf5;
      cursor: pointer;
      user-select: none;
    }
    .slide {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 5vh 8vw;
      font-size: clamp(20px, 4vw, 48px);
      line-height: 1.5;
      overflow: auto;
    }
    .slide.title { align-items: center; text-align: center; }
    .slide h1 { font-size: 1.6em; margin: 0; }
    .slide h2 { font-size: 1.2em; margin: 0 0 0.5em; }
    .slide ul { margin: 0 0 0.5em; padding-left: 1.2em; }
    .slide p { margin: 0 0 0.5em; }
    .slide a { font-size: 0.6em; }
    .bar {
      display: flex;
      justify-content: space-between;
      padding: 8px 16px;
      font-size: 14px;
      color: #888;
    }
    .bar a { color: #888; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main id="list">
    <h1>即席LT大会</h1>
    <div class="tools">
      <button id="shuffle">シャッフル</button>
      <button id="random">ランダムに1つ再生</button>
    </div>
    <div class="cards" id="cards"></div>
  </main>

  <div id="player" hidden>
    <div class="slide" id="slide"></div>
    <div class="bar">
      <a href="#">一覧へ戻る (Esc)</a>
      <span id="page"></span>
    </div>
  </div>

  <script>
    // 全部のヒントの最後に付けるページ
    const ENDING = `## あなたの番です

- 最近驚いたことは？
- どうなると予想していた？
- 次に同じことが起きたら、どうしたい？
- そうすると、どうなると予想できる？`;

    let hints = [];
    const decks = {};

    const escapeHTML = (s) => s.replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
    const inline = (s) => escapeHTML(s)
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\[(.+?)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

    // ページ単位の小さな Markdown 変換。見出し・箇条書き・段落・リンク・太字だけ扱う
    const renderPage = (md) => {
      const html = [];
      let list = null;
      const closeList = () => { if (list) { html.push(`<ul>${list.join('')}</ul>`); list = null; } };
      for (const line of md.trim().split('\n')) {
        if (line.startsWith('- ')) {
          (list ||= []).push(`<li>${inline(line.slice(2))}</li>`);
          continue;
        }
        closeList();
        if (line.startsWith('# ')) html.push(`<h1>${inline(line.slice(2))}</h1>`);
        else if (line.startsWith('## ')) html.push(`<h2>${inline(line.slice(3))}</h2>`);
        else if (line.trim()) html.push(`<p>${inline(line)}</p>`);
      }
      closeList();
      return html.join('');
    };

    const loadDeck = async (slug) => {
      if (!decks[slug]) {
        const md = await (await fetch(`hints/${slug}.md`)).text();
        decks[slug] = [...md.split(/^---$/m), ENDING].map((p) => p.trim()).filter(Boolean);
      }
      return decks[slug];
    };

    const renderCards = () => {
      document.getElementById('cards').innerHTML = hints.map((h) =>
        `<a class="card" href="#/${h.slug}/1"><span class="play">▶</span>${escapeHTML(h.title)}</a>`
      ).join('');
    };

    // URL は #/スラッグ/ページ番号
    const route = async () => {
      const m = location.hash.match(/^#\/([\w-]+)\/(\d+)$/);
      document.getElementById('list').hidden = !!m;
      document.getElementById('player').hidden = !m;
      if (!m) return;
      const pages = await loadDeck(m[1]);
      const n = Math.min(Math.max(Number(m[2]), 1), pages.length);
      const slide = document.getElementById('slide');
      slide.innerHTML = renderPage(pages[n - 1]);
      slide.classList.toggle('title', /^# [^\n]*$/.test(pages[n - 1]));
      document.getElementById('page').textContent = `${n} / ${pages.length}`;
    };

    const move = (d) => {
      const m = location.hash.match(/^#\/([\w-]+)\/(\d+)$/);
      if (!m) return;
      const pages = decks[m[1]];
      const n = Number(m[2]) + d;
      if (n < 1 || n > pages.length) return;
      location.hash = `#/${m[1]}/${n}`;
    };

    document.addEventListener('keydown', (e) => {
      if (['ArrowRight', 'ArrowDown', ' ', 'PageDown'].includes(e.key)) { e.preventDefault(); move(1); }
      if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(e.key)) { e.preventDefault(); move(-1); }
      if (e.key === 'Escape') location.hash = '';
    });
    // 画面の左3分の1で戻る、それ以外で進む。リンクのクリックは除く
    document.getElementById('player').addEventListener('click', (e) => {
      if (e.target.closest('a')) return;
      move(e.clientX < innerWidth / 3 ? -1 : 1);
    });
    document.getElementById('shuffle').addEventListener('click', () => {
      hints.sort(() => Math.random() - 0.5);
      renderCards();
    });
    document.getElementById('random').addEventListener('click', () => {
      const h = hints[Math.floor(Math.random() * hints.length)];
      location.hash = `#/${h.slug}/1`;
    });
    addEventListener('hashchange', route);

    (async () => {
      hints = await (await fetch('hints/index.json')).json();
      renderCards();
      route();
    })();
  </script>
</body>
</html>
